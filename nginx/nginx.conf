events {
}

http {
    include /etc/nginx/mime.types;

    server {
        listen 80;

        location /api/ {
            proxy_set_header Host $host;
            proxy_pass http://backend:8000;
        }

        location /admin/ {
            proxy_set_header Host $host;
            proxy_pass http://backend:8000;
        }

        location /static/ {
            alias /staticfiles/;
        }
    }
}